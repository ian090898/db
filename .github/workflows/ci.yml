
name: DB CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URL: mongodb://127.0.0.1:27017

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Generate and verify mocks
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain -- mocks/)" ]; then
            git status --short -- mocks/
            exit 1
          fi

      - name: Run tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
